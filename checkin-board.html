<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Check-In Board — Mutts in the 6ix</title>
  <link rel="icon" type="image/svg+xml" href="/paw-favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple: #8C81BD;
      --purple-dark: #6f63a8;
      --orange: #E79F52;
      --bg: #f5f4fb;
      --card: #ffffff;
      --text: #1a1a2e;
      --muted: #6b7280;
      --border: #e5e2f5;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, var(--purple) 0%, var(--purple-dark) 100%);
      color: white;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 20px rgba(140,129,189,0.35);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .page-body {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 88px); /* subtract header height */
    }

    .logo-area {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 24px 16px;
      flex-shrink: 0;
    }

    .logo-area img {
      width: 280px;
      height: 280px;
      object-fit: contain;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    header p {
      font-size: 0.85rem;
      opacity: 0.85;
      margin-top: 2px;
    }

    #status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4ade80;
      display: inline-block;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    #status-dot.disconnected { background: #f87171; animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    #connection-label {
      font-size: 0.75rem;
      opacity: 0.9;
      display: flex;
      align-items: center;
    }

    main {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 0 24px;
      flex: 1;
      overflow-y: auto;
      padding-bottom: 40px;
    }


    #empty-state {
      text-align: center;
      padding: 24px 20px;
      color: var(--muted);
    }

    #empty-state h2 { font-size: 1.1rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    #empty-state p { font-size: 0.875rem; }

    #list {
      display: grid;
      gap: 12px;
    }

    .entry {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 8px rgba(140,129,189,0.07);
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .entry.new-flash { animation: flash 0.6s ease; }

    @keyframes flash {
      0%   { background: #f0eeff; }
      100% { background: var(--card); }
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple) 0%, var(--purple-dark) 100%);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .entry-info { flex: 1; }

    .entry-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text);
    }

    .entry-dog {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .dog-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #fff8ed;
      border: 1px solid #fde7ba;
      color: var(--orange);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .no-dog-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      color: var(--muted);
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 0.78rem;
    }

    .newest-badge {
      font-size: 0.65rem;
      font-weight: 700;
      background: var(--purple);
      color: white;
      border-radius: 6px;
      padding: 2px 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div>
      <h1>Mutts in the 6ix — Check-In Board</h1>
      <p>Live view of completed waivers</p>
    </div>
  </div>
  <div id="connection-label">
    <span id="status-dot"></span>
    <span id="status-text">Connecting…</span>
  </div>
</header>

<div class="page-body">
  <div class="logo-area">
    <img src="/logo.png" alt="Mutts in the 6ix" />
  </div>

  <main>
    <div id="empty-state">
      <h2>No check-ins yet</h2>
      <p>The board will update automatically as waivers are completed.</p>
    </div>

    <div id="list"></div>
  </main>
</div>

<script>
  const API = 'http://localhost:3001';
  let knownCount = 0;

  function initials(first, last) {
    return ((first?.[0] || '') + (last?.[0] || '')).toUpperCase();
  }

  function render(data) {
    const list = document.getElementById('list');
    const empty = document.getElementById('empty-state');
    const isNew = data.length > knownCount;
    const newEntries = isNew ? data.slice(knownCount) : [];
    knownCount = data.length;

    empty.style.display = data.length === 0 ? 'block' : 'none';

    // Rebuild list newest-first
    const sorted = [...data].reverse();
    list.innerHTML = sorted.map((entry, i) => {
      const isNewest = i === 0 && isNew && newEntries.length > 0;
      const dogBadge = entry.has_dog
        ? `<span class="dog-badge">🐕 ${entry.dog_name ? escapeHtml(entry.dog_name) : 'Dog'}</span>`
        : `<span class="no-dog-badge">No dog</span>`;

      return `
        <div class="entry${isNewest ? ' new-flash' : ''}">
          <div class="avatar">${initials(entry.first_name, entry.last_name)}</div>
          <div class="entry-info">
            <div class="entry-name">${escapeHtml(entry.first_name)} ${escapeHtml(entry.last_name)}${isNewest ? ' <span class="newest-badge">Just arrived</span>' : ''}</div>
            <div class="entry-dog">${dogBadge}</div>
          </div>
        </div>`;
    }).join('');
  }

  function escapeHtml(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function setStatus(connected) {
    const dot = document.getElementById('status-dot');
    const txt = document.getElementById('status-text');
    dot.className = connected ? '' : 'disconnected';
    txt.textContent = connected ? 'Live' : 'Reconnecting…';
  }

  function connect() {
    const es = new EventSource(`${API}/api/checked-in/stream`);

    es.onopen = () => setStatus(true);

    es.onmessage = (e) => {
      try { render(JSON.parse(e.data)); } catch {}
    };

    es.onerror = () => {
      setStatus(false);
      es.close();
      setTimeout(connect, 3000);
    };
  }

  connect();
</script>
</body>
</html>
